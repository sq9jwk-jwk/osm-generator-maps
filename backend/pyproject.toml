[project]
name = "osm-tilegen"
version = "0.1.0"
description = "Offline OSM raster tile generator with a web UI"
requires-python = ">=3.11"
# Runtime deps are all packaged in Debian 13 (python3-fastapi, python3-uvicorn,
# python3-pil), so the .deb needs no pip and installs offline.
dependencies = ["fastapi", "uvicorn", "pillow"]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff", "mypy"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.tiles.*", "app.osm.*"]
strict = true
